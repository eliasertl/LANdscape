<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Template</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1 id="title">Template</h1>
      <p class="muted" id="context"></p>
      <section>
        <h2>Storage</h2>
        <p>The counter lives in LANdscape's database (permission <code>storage</code>).</p>
        <p><button id="count" type="button">Clicked 0 times</button> <button id="reset" type="button" class="plain">Reset</button></p>
      </section>
      <section>
        <h2>Metrics</h2>
        <p id="cpu" class="muted">Waiting for CPU…</p>
      </section>
      <section>
        <h2>Notifications</h2>
        <p><button id="notify" type="button">Send a notification</button></p>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
